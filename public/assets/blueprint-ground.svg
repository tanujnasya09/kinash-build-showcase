<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c2834" stroke-width="0.75" />
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#253545" stroke-width="1.2" />
    </pattern>
    <!-- Wall Hatch Pattern -->
    <pattern id="wallHatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#dfba48" stroke-width="1.5" opacity="0.35" />
    </pattern>
    <!-- Pool Water Pattern -->
    <linearGradient id="poolWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e3d54" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0b2b3c" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background Blueprint Slate -->
  <rect width="1200" height="800" fill="#090d12" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <!-- Outer Architectural Border with Corner Registration Marks -->
  <rect x="25" y="25" width="1150" height="750" fill="none" stroke="#dfba48" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="35" y="35" width="1130" height="730" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.25" />

  <!-- Registration Marks -->
  <g stroke="#dfba48" stroke-width="1.2" opacity="0.7">
    <line x1="25" y1="15" x2="25" y2="35" />
    <line x1="15" y1="25" x2="35" y2="25" />
    <line x1="1175" y1="15" x2="1175" y2="35" />
    <line x1="1165" y1="25" x2="1185" y2="25" />
    <line x1="25" y1="765" x2="25" y2="785" />
    <line x1="15" y1="775" x2="35" y2="775" />
    <line x1="1175" y1="765" x2="1175" y2="785" />
    <line x1="1165" y1="775" x2="1185" y2="775" />
  </g>

  <!-- Architectural Axis Lines & Bubble Markers -->
  <!-- Top Grid Callouts (1, 2, 3, 4, 5) -->
  <g fill="#090d12" stroke="#38bdf8" stroke-width="1" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">
    <circle cx="120" cy="55" r="14" />
    <text x="120" y="59" fill="#38bdf8" stroke="none">A</text>
    <line x1="120" y1="70" x2="120" y2="720" stroke="#38bdf8" stroke-dasharray="4,6" stroke-opacity="0.2" />

    <circle cx="340" cy="55" r="14" />
    <text x="340" y="59" fill="#38bdf8" stroke="none">B</text>
    <line x1="340" y1="70" x2="340" y2="720" stroke="#38bdf8" stroke-dasharray="4,6" stroke-opacity="0.2" />

    <circle cx="600" cy="55" r="14" />
    <text x="600" y="59" fill="#38bdf8" stroke="none">C</text>
    <line x1="600" y1="70" x2="600" y2="720" stroke="#38bdf8" stroke-dasharray="4,6" stroke-opacity="0.2" />

    <circle cx="860" cy="55" r="14" />
    <text x="860" y="59" fill="#38bdf8" stroke="none">D</text>
    <line x1="860" y1="70" x2="860" y2="720" stroke="#38bdf8" stroke-dasharray="4,6" stroke-opacity="0.2" />

    <circle cx="1060" cy="55" r="14" />
    <text x="1060" y="59" fill="#38bdf8" stroke="none">E</text>
    <line x1="1060" y1="70" x2="1060" y2="720" stroke="#38bdf8" stroke-dasharray="4,6" stroke-opacity="0.2" />
  </g>

  <!-- Left Grid Callouts (1, 2, 3, 4) -->
  <g fill="#090d12" stroke="#38bdf8" stroke-width="1" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">
    <circle cx="55" cy="140" r="14" />
    <text x="55" y="144" fill="#38bdf8" stroke="none">01</text>
    <line x1="70" y1="140" x2="1110" y2="140" stroke="#38bdf8" stroke-dasharray="4,6" stroke-opacity="0.2" />

    <circle cx="55" cy="360" r="14" />
    <text x="55" y="364" fill="#38bdf8" stroke="none">02</text>
    <line x1="70" y1="360" x2="1110" y2="360" stroke="#38bdf8" stroke-dasharray="4,6" stroke-opacity="0.2" />

    <circle cx="55" cy="580" r="14" />
    <text x="55" y="584" fill="#38bdf8" stroke="none">03</text>
    <line x1="70" y1="580" x2="1110" y2="580" stroke="#38bdf8" stroke-dasharray="4,6" stroke-opacity="0.2" />
  </g>

  <!-- ==================== ROOM BOUNDARIES & WALLS ==================== -->

  <!-- ROOM 1: GRAND LIVING PAVILION (Center Left) -->
  <rect x="340" y="140" width="360" height="260" fill="#0f1620" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="340" y="140" width="360" height="260" fill="url(#wallHatch)" opacity="0.15" />
  <!-- Thick Structural Walls -->
  <rect x="334" y="134" width="372" height="12" fill="#dfba48" />
  <rect x="334" y="134" width="12" height="272" fill="#dfba48" />
  <rect x="334" y="394" width="372" height="12" fill="#dfba48" />

  <!-- ROOM 2: FORMAL DINING GALLERY (Center Right) -->
  <rect x="700" y="140" width="240" height="260" fill="#111824" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="694" y="134" width="252" height="12" fill="#dfba48" />
  <rect x="934" y="134" width="12" height="272" fill="#dfba48" />
  <rect x="694" y="394" width="252" height="12" fill="#dfba48" />

  <!-- ROOM 3: CHEF'S KITCHEN & BUTLER'S PANTRY (Far Right) -->
  <rect x="940" y="140" width="140" height="260" fill="#0c131c" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="1074" y="134" width="12" height="272" fill="#dfba48" />
  <rect x="940" y="394" width="146" height="12" fill="#dfba48" />

  <!-- ROOM 4: GRAND ENTRANCE FOYER & ATRIUM (Center Bottom) -->
  <rect x="480" y="400" width="220" height="220" fill="#131c28" stroke="#dfba48" stroke-width="1.5" stroke-dasharray="3,3" />
  <!-- Entrance Double Door Swing -->
  <path d="M 540 620 A 40 40 0 0 1 580 580" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2,2" />
  <line x1="540" y1="620" x2="540" y2="580" stroke="#38bdf8" stroke-width="2" />
  <path d="M 640 620 A 40 40 0 0 0 600 580" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2,2" />
  <line x1="640" y1="620" x2="640" y2="580" stroke="#38bdf8" stroke-width="2" />

  <!-- ROOM 5: EXECUTIVE LIBRARY / PRIVATE STUDY (Bottom Left) -->
  <rect x="220" y="400" width="260" height="220" fill="#0f1722" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="214" y="394" width="12" height="232" fill="#dfba48" />
  <rect x="214" y="614" width="272" height="12" fill="#dfba48" />

  <!-- ROOM 6: GUEST SUITE 01 WITH ENSUITE (Bottom Right) -->
  <rect x="700" y="400" width="260" height="220" fill="#0f1722" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="954" y="394" width="12" height="232" fill="#dfba48" />
  <rect x="694" y="614" width="272" height="12" fill="#dfba48" />
  <!-- Guest Bathroom Partition -->
  <rect x="840" y="400" width="120" height="110" fill="#0b121a" stroke="#38bdf8" stroke-width="1" />

  <!-- ROOM 7: INFINITY REFLECTION POOL & SUN DECK (Top Left Exterior) -->
  <rect x="120" y="140" width="214" height="254" fill="url(#poolWater)" stroke="#38bdf8" stroke-width="2" />
  <!-- Water ripples -->
  <ellipse cx="227" cy="267" rx="80" ry="50" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
  <ellipse cx="227" cy="267" rx="50" ry="30" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" />
  <!-- Deck Sunloungers Schematic -->
  <rect x="140" y="160" width="30" height="55" fill="none" stroke="#dfba48" stroke-width="1" />
  <rect x="180" y="160" width="30" height="55" fill="none" stroke="#dfba48" stroke-width="1" />

  <!-- ROOM 8: 3-CAR COVERED VEHICULAR PORTICO (Far Bottom Left) -->
  <rect x="120" y="440" width="100" height="180" fill="#080c10" stroke="#dfba48" stroke-width="1" stroke-dasharray="4,4" />

  <!-- ==================== ROOM LABELS & TYPOGRAPHY ==================== -->
  <g font-family="'Courier New', monospace" fill="#ffffff" text-anchor="middle">
    <!-- Living -->
    <text x="520" y="240" font-size="14" font-weight="bold" fill="#dfba48" letter-spacing="1">01 // GRAND LIVING PAVILION</text>
    <text x="520" y="260" font-size="11" fill="#94a3b8">DIM: 28'-6" × 22'-0" [8.69m × 6.70m]</text>
    <text x="520" y="278" font-size="9" fill="#38bdf8">DOUBLE HEIGHT CEILING // 4.2M CLEAR</text>

    <!-- Dining -->
    <text x="820" y="245" font-size="13" font-weight="bold" fill="#dfba48" letter-spacing="1">02 // FORMAL DINING</text>
    <text x="820" y="265" font-size="10" fill="#94a3b8">18'-0" × 15'-0" [5.48m × 4.57m]</text>
    <text x="820" y="282" font-size="8" fill="#38bdf8">SEATS 14 GUESTS</text>

    <!-- Kitchen -->
    <text x="1010" y="245" font-size="11" font-weight="bold" fill="#dfba48" letter-spacing="0.5">03 // CHEF KITCHEN</text>
    <text x="1010" y="265" font-size="9" fill="#94a3b8">16'-4" × 14'-8"</text>
    <text x="1010" y="280" font-size="8" fill="#38bdf8">SUB-ZERO APPLIANCES</text>

    <!-- Foyer -->
    <text x="590" y="490" font-size="12" font-weight="bold" fill="#dfba48" letter-spacing="1">04 // ATRIUM FOYER</text>
    <text x="590" y="510" font-size="10" fill="#94a3b8">16'-0" × 14'-0"</text>
    <text x="590" y="528" font-size="8" fill="#4fd1c5">MARBLE WATERFALL</text>

    <!-- Study -->
    <text x="350" y="495" font-size="12" font-weight="bold" fill="#dfba48" letter-spacing="1">05 // EXECUTIVE STUDY</text>
    <text x="350" y="515" font-size="10" fill="#94a3b8">17'-0" × 14'-6"</text>
    <text x="350" y="532" font-size="8" fill="#94a3b8">ACOUSTIC TEAK LINING</text>

    <!-- Guest Suite -->
    <text x="770" y="540" font-size="12" font-weight="bold" fill="#dfba48" letter-spacing="1">06 // GUEST SUITE 01</text>
    <text x="770" y="558" font-size="10" fill="#94a3b8">18'-6" × 14'-6"</text>
    <text x="900" y="455" font-size="9" fill="#38bdf8">ENSUITE</text>

    <!-- Pool -->
    <text x="227" y="325" font-size="11" font-weight="bold" fill="#38bdf8" letter-spacing="1">INFINITY POOL</text>
    <text x="227" y="342" font-size="9" fill="#cbd5e1">15.0m × 5.2m HEATED</text>

    <!-- Portico -->
    <text x="170" y="530" font-size="9" font-weight="bold" fill="#94a3b8" letter-spacing="1" transform="rotate(-90 170 530)">PORTICO 3-CAR</text>
  </g>

  <!-- ==================== COMPASS ROSE (North Arrow) ==================== -->
  <g transform="translate(1100, 100)">
    <circle cx="0" cy="0" r="28" fill="#090d12" stroke="#dfba48" stroke-width="1.2" />
    <polygon points="0,-24 6,-2 0,-8" fill="#dfba48" />
    <polygon points="0,-24 -6,-2 0,-8" fill="#ffffff" />
    <polygon points="0,24 6,2 0,8" fill="#38bdf8" opacity="0.6" />
    <polygon points="0,24 -6,2 0,8" fill="#ffffff" opacity="0.6" />
    <text x="0" y="-30" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#dfba48" text-anchor="middle">N</text>
    <text x="0" y="38" font-family="'Courier New', monospace" font-size="8" fill="#94a3b8" text-anchor="middle">0°00'00"</text>
  </g>

  <!-- ==================== DIMENSION CALLOUT STRINGS ==================== -->
  <g stroke="#38bdf8" stroke-width="0.8" opacity="0.75" font-family="'Courier New', monospace" font-size="9" fill="#38bdf8">
    <!-- Top Overall Dimension Line -->
    <line x1="334" y1="110" x2="1080" y2="110" />
    <line x1="334" y1="102" x2="334" y2="118" />
    <line x1="1080" y1="102" x2="1080" y2="118" />
    <text x="707" y="104" text-anchor="middle" stroke="none">OVERALL BUILT SPAN: 74'-6" [22.71m]</text>

    <!-- Left Living Dimension -->
    <line x1="310" y1="140" x2="310" y2="400" />
    <line x1="302" y1="140" x2="318" y2="140" />
    <line x1="302" y1="400" x2="318" y2="400" />
    <text x="295" y="275" text-anchor="middle" stroke="none" transform="rotate(-90 295 275)">28'-6" [8.69m]</text>
  </g>

  <!-- ==================== PROFESSIONAL ARCHITECTURAL TITLE BLOCK ==================== -->
  <g transform="translate(680, 650)">
    <!-- Title Box Border -->
    <rect x="0" y="0" width="460" height="90" fill="#0c1219" stroke="#dfba48" stroke-width="1.5" />
    <line x1="0" y1="30" x2="460" y2="30" stroke="#dfba48" stroke-width="0.8" opacity="0.5" />
    <line x1="280" y1="30" x2="280" y2="90" stroke="#dfba48" stroke-width="0.8" opacity="0.5" />

    <!-- Brand Header -->
    <text x="15" y="20" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#dfba48" letter-spacing="1.5">
      APEX LUXURY ARCHITECTURE &amp; CONTRACTING
    </text>
    <text x="445" y="20" font-family="'Courier New', monospace" font-size="9" fill="#38bdf8" text-anchor="end">
      ISO 9001:2026 // RERA CERTIFIED
    </text>

    <!-- Project Details -->
    <text x="15" y="48" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#ffffff">
      PROJECT: APEX ULTRA-PRIME RESIDENTIAL ESTATE
    </text>
    <text x="15" y="64" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8">
      LOCATION: PRIVATE GATED RESERVE // PHASE 1
    </text>
    <text x="15" y="78" font-family="'Courier New', monospace" font-size="8" fill="#4fd1c5">
      SHEET: A-101 // LEVEL 01 GROUND FLOOR PLAN
    </text>

    <!-- Metadata Block (Right) -->
    <text x="295" y="48" font-family="'Courier New', monospace" font-size="8" fill="#94a3b8">SCALE: 1:100 @ A3</text>
    <text x="295" y="62" font-family="'Courier New', monospace" font-size="8" fill="#94a3b8">STATUS: ISSUED FOR CONSTRUCTION</text>
    <text x="295" y="76" font-family="'Courier New', monospace" font-size="8" fill="#dfba48">REV: C // APPROVED EXECUTIVE</text>
  </g>
</svg>
